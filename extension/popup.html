<!doctype html>
<meta charset="utf-8">
<title>TruthLens</title>
<style>
  /* TruthLens — same design system as the dashboard, at popup density.
     Fonts are bundled with the extension: the product runs offline. */
  @font-face {
    font-family: "Public Sans";
    src: url("fonts/public-sans.woff2") format("woff2");
    font-weight: 300 800; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Instrument Serif";
    src: url("fonts/instrument-serif.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }

  :root {
    color-scheme: light;
    --paper:#fcfcfd; --card:#fff; --sunken:#f6f7f9; --rule:#e4e7ec; --rule-soft:#eef0f3;
    --ink:#10151f; --graphite:#5a6472; --mist:#667080;
    --lens:#0e6b70; --lens-deep:#0a5054; --lens-wash:#e6f2f2;
    --false:#b42318; --mixed:#b54708; --true:#067647; --related:#5925dc; --none:#667085;
    --false-wash:#fef3f2; --mixed-wash:#fffaeb; --true-wash:#ecfdf3;
    --related-wash:#f4f3ff; --none-wash:#f2f4f7;
    --sans:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --display:"Instrument Serif", ui-serif, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    width: 404px; max-height: 600px; overflow-y: auto; margin: 0;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 13.5px; line-height: 1.55;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lens); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--lens); outline-offset: 2px; border-radius: 4px; }

  /* ---------- chrome ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; background: var(--paper); z-index: 3;
  }
  .wordmark {
    font-family: var(--display); font-size: 19px; font-weight: 400; margin: 0;
    display: flex; align-items: center; gap: 7px;
  }
  .lens-mark { width: 11px; height: 11px; border-radius: 50%;
               border: 2.5px solid var(--lens); flex: none; }
  .ghost {
    font: inherit; font-size: 11.5px; color: var(--graphite); background: none;
    border: 1px solid var(--rule); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  .ghost:hover { background: var(--sunken); color: var(--ink); }
  main { padding: 16px; }
  footer {
    border-top: 1px solid var(--rule); padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10.5px; color: var(--mist);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mist);
         display: inline-block; margin-right: 6px; }
  .dot.up { background: var(--true); } .dot.down { background: var(--false); }

  /* ---------- shared ---------- */
  .muted { color: var(--graphite); }
  .small { font-size: 11.5px; }
  .eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--mist); display: block; margin-bottom: 4px;
  }
  code { font-family: var(--mono); font-size: 11px; background: var(--sunken);
         border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }

  /* ---------- the text under examination ---------- */
  .source {
    background: var(--card); border: 1px solid var(--rule); border-radius: 9px;
    padding: 10px 12px; margin-bottom: 14px; max-height: 86px; overflow-y: auto;
    font-size: 12.5px; line-height: 1.5;
  }

  /* ---------- readout ---------- */
  .readout {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 15px 16px; margin-bottom: 16px;
  }
  .verdict-head { display: flex; align-items: baseline; gap: 13px; margin-bottom: 14px; }
  .score { font-family: var(--display); font-size: 50px; line-height: .78; letter-spacing: -.02em; }
  .score-max { font-family: var(--sans); font-size: 12px; color: var(--mist); }
  .band { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .verdict-note { color: var(--graphite); font-size: 11.5px; }

  .meter { display: flex; height: 18px; border-radius: 4px; overflow: hidden;
           background: var(--sunken); border: 1px solid var(--rule); }
  .meter-seg.lowers { background: var(--false); }
  .meter-seg.raises { background: var(--true); }
  .meter-seg.neutral { background: var(--none); }
  .meter-seg.unmeasured {
    flex: 1; background-image: repeating-linear-gradient(-45deg, #fff 0 5px, #d7dce4 5px 7px);
  }
  .meter-key { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 9px;
               font-size: 11.5px; color: var(--graphite); }
  .meter-key-item { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .swatch.lowers { background: var(--false); }
  .swatch.raises { background: var(--true); }
  .swatch.neutral { background: var(--none); }
  .swatch.unmeasured {
    background-image: repeating-linear-gradient(-45deg, #fff 0 3px, #d7dce4 3px 5px);
    border: 1px solid var(--rule);
  }
  .meter-key b { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--ink); }
  .meter-caption { margin: 9px 0 0; font-size: 11px; color: var(--mist); line-height: 1.45; }


  .live { margin-top: 10px; padding: 9px 11px; border: 1px dashed var(--rule);
          border-radius: 8px; background: var(--sunken); }
  .live-head { display: flex; align-items: center; gap: 6px; font-family: var(--mono);
               font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
               color: var(--graphite); margin-bottom: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .live-note { margin: 6px 0 0; font-size: 11px; color: var(--mist); line-height: 1.45; }

  /* ---------- claims ---------- */
  h2.eyebrow { margin: 18px 0 9px; }
  .claim {
    background: var(--card); border: 1px solid var(--rule); border-radius: 9px;
    padding: 11px 12px; margin-bottom: 8px;
  }
  .claim-head { display: flex; gap: 9px; align-items: flex-start; }
  .claim-text { flex: 1; font-size: 13px; line-height: 1.45; margin: 0; }
  .tag {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; padding: 3px 7px; border-radius: 4px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .tag.false   { color: var(--false);   background: var(--false-wash);   border-color: #fecdca; }
  .tag.mixed   { color: var(--mixed);   background: var(--mixed-wash);   border-color: #fedf89; }
  .tag.true    { color: var(--true);    background: var(--true-wash);    border-color: #abefc6; }
  .tag.related { color: var(--related); background: var(--related-wash); border-color: #d9d6fe; }
  .tag.no_match{ color: var(--none);    background: var(--none-wash);    border-color: var(--rule); }

  .evidence { margin-top: 10px; padding-left: 11px; border-left: 2px solid var(--rule); }
  .evidence-claim { margin: 0; font-size: 12.5px; line-height: 1.45; }
  .evidence-meta {
    margin-top: 5px; font-size: 11px; color: var(--graphite);
    display: flex; flex-wrap: wrap; gap: 3px 9px; align-items: center;
  }
  .evidence-meta .num { font-family: var(--mono); font-size: 10.5px; }

  .guard {
    margin-top: 9px; padding: 8px 10px; border-radius: 7px;
    background: var(--mixed-wash); border: 1px solid #fedf89;
    font-size: 11.5px; line-height: 1.45; color: #93370d;
  }
  .guard .eyebrow { color: #93370d; margin-bottom: 2px; }
  .claim-note { margin: 9px 0 0; font-size: 11.5px; color: var(--graphite); }

  details { margin-top: 8px; }
  summary {
    cursor: pointer; font-size: 11.5px; color: var(--lens); list-style: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; font-family: var(--mono); }
  details[open] summary::before { content: "\2212"; }
  .reveal-body {
    margin-top: 7px; padding-left: 11px; border-left: 2px solid var(--rule-soft);
    font-size: 11.5px; color: var(--graphite);
  }
  .reveal-body ul { margin: 5px 0 0; padding-left: 15px; }
  .reveal-body li { margin-bottom: 3px; }

  /* ---------- method ---------- */
  .method-row {
    display: grid; grid-template-columns: 84px 1fr; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--rule-soft); font-size: 11.5px;
  }
  .method-row:last-child { border-bottom: 0; }
  .method-factor { font-weight: 600; font-size: 12px; }
  .dir { font-family: var(--mono); font-size: 9px; letter-spacing: .05em; text-transform: uppercase; }
  .dir.lowers { color: var(--false); } .dir.raises { color: var(--true); } .dir.neutral { color: var(--mist); }
  .method-detail { color: var(--graphite); line-height: 1.45; }

  /* ---------- composer / states ---------- */
  textarea {
    width: 100%; height: 88px; resize: vertical; padding: 10px 11px;
    border: 1px solid var(--rule); border-radius: 9px; background: var(--card);
    color: inherit; font: inherit; font-size: 13px; line-height: 1.5;
  }
  textarea::placeholder { color: var(--mist); }
  textarea:focus { outline: none; border-color: var(--lens); box-shadow: 0 0 0 3px var(--lens-wash); }
  .btn {
    width: 100%; margin-top: 9px; padding: 9px; border: 1px solid var(--lens);
    border-radius: 8px; background: var(--lens); color: #fff; font: inherit;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--lens-deep); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .notice {
    padding: 11px 12px; border-radius: 9px; border: 1px solid var(--rule);
    background: var(--card); font-size: 12.5px; color: var(--graphite);
  }
  .notice.alert { border-color: #fecdca; background: var(--false-wash); color: #912018; }
  .notice-title { display: block; font-weight: 700; margin-bottom: 2px; }

  .working { display: flex; align-items: center; gap: 9px; color: var(--graphite);
             font-size: 12.5px; padding: 22px 0; justify-content: center; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--lens);
           animation: pulse 1.1s ease-in-out infinite; flex: none; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .7; } }
</style>

<header>
  <h1 class="wordmark"><span class="lens-mark" aria-hidden="true"></span>TruthLens</h1>
  <button id="again" class="ghost" hidden>Check other text</button>
</header>

<main id="main"></main>

<footer>
  <span><span class="dot" id="dot"></span><span id="health">checking…</span></span>
  <a href="http://localhost:5173" target="_blank">Open dashboard →</a>
</footer>

<script src="popup.js"></script>
